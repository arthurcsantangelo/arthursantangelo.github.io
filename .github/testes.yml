name: Testes automatizados

on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  jest:
    name: Jest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Configurar o nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npx jest --ci